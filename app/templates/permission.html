<!DOCTYPE html>

  <!-- 0ms FOUC Prevention Theme Script (Toss TDS Dark Theme) -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('aisum_theme') || 'light';
        var eff = t;
        if (t === 'system') {
          eff = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', eff);
      } catch(e) {}
    })();
  </script>

  <style>

        if (!isTermsAgreed) {

          window.location.replace('terms.html');
          return;
        }
      } catch (e) {
        window.location.replace('terms.html');
        return;
      }
    })();

    // 0-2. 이미 권한을 부여받은 사용자는 메인 화면으로 즉시 직행 (앱 내 권한 영구 유지)
    (function checkExistingPermission() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const force = urlParams.get('force');
        const isGranted = localStorage.getItem('aisum_permission_granted') === 'true';
        if (isGranted && force !== 'true') {
          console.log('✅ 이미 접근 권한이 영구 승인되었습니다. 메인 홈으로 바로 이동합니다.');
          window.location.replace('index.html');
        }
      } catch (e) {
        console.warn('Permission check error:', e);
      }
    })();

    const AISUM_NATIONWIDE_NODES = [

      { name: '치평동(상무)', gu: '광주 서구', lat: 35.1522, lon: 126.8525 },
      { name: '효자동', gu: '전주 완산구', lat: 35.81716, lon: 127.102276 },
      { name: '조례동', gu: '순천시', lat: 34.954214, lon: 127.518412 },
      // 강원 / 제주
      { name: '일산동', gu: '원주시', lat: 37.338412, lon: 127.941214 },
      { name: '탑동', gu: '제주시', lat: 33.517551, lon: 126.522463 }
    ];

    function estimateDongName(lat, lon) {
      let best = '역삼동';
      let minD = Infinity;
      for (const node of AISUM_NATIONWIDE_NODES) {
        const dLat = (lat - node.lat) * (Math.PI / 180);
        const dLon = (lon - node.lon) * (Math.PI / 180);
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat * (Math.PI / 180)) * Math.cos(node.lat * (Math.PI / 180)) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        const dist = 6371 * c;
        if (dist < minD) {
          minD = dist;
          best = node.name;
        }
      }
      return best;
    }

    // Request Actual Device / Browser Permissions (Location & Notification & System)
    async function onConfirmPermission() {
      const btn = document.getElementById('btnConfirmPermission');
      if (btn) {
        btn.disabled = true;
        btn.style.opacity = '0.85';
        btn.innerHTML = '<span style="display:inline-flex; align-items:center; gap:6px;"><span class="material-symbols-outlined" style="font-size:18px; animation:spin 1s linear infinite;">sync</span> 위치 권한 확인 중...</span>';
      }

      // Helper function to request Geolocation with standard pattern
      const requestLocation = () => new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve('unsupported');
          return;
        }

        navigator.geolocation.getCurrentPosition(
          async function(position) {
            const lat = position.coords.latitude;  // 위도
            const lon = position.coords.longitude; // 경도
            console.log(`위도: ${lat}, 경도: ${lon}`);

            try {
              // 1. 위경도 좌표 저장 (localStorage & sessionStorage 상시 유지)
              localStorage.setItem('user_lat', lat);
              localStorage.setItem('user_lon', lon);
              sessionStorage.setItem('user_lat', lat);
              sessionStorage.setItem('user_lon', lon);
              localStorage.setItem('aisum_user_lat', lat);
              localStorage.setItem('aisum_user_lon', lon);
              sessionStorage.setItem('aisum_user_lat', lat);
              sessionStorage.setItem('aisum_user_lon', lon);

              let dongName = estimateDongName(lat, lon);
              let fullAddress = '';

              try {
                const isFileProto = window.location.protocol === 'file:';
                const isNon8000 = (window.location.port !== '8000' && window.location.port !== '');
                const apiBase = (isFileProto || isNon8000) ? 'http://127.0.0.1:8000' : '';
                const resp = await fetch(`${apiBase}/api/v1/location/coord2address?lat=${lat}&lon=${lon}`);
                if (resp.ok) {
                  const data = await resp.json();
                  if (data && data.full_address) {
                    fullAddress = data.full_address;
                    if (data.dong && data.dong !== '현재 위치' && data.dong !== '내 위치') {
                      dongName = data.dong;
                    }
                  }
                }
              } catch (e) {
                console.warn('역지오코딩 백엔드 연결 폴백:', e);
              }

              if (!fullAddress) {
                fullAddress = (dongName && dongName !== '현재 위치') ? `대한민국 ${dongName}` : '대한민국 서울특별시';
              }

              localStorage.setItem('aisum_user_dong', dongName);
              localStorage.setItem('user_dong', dongName);
              sessionStorage.setItem('aisum_user_dong', dongName);
              sessionStorage.setItem('user_dong', dongName);

              localStorage.setItem('aisum_user_address', fullAddress);
              sessionStorage.setItem('aisum_user_address', fullAddress);

              localStorage.setItem('aisum_permission_location', 'granted');
              sessionStorage.setItem('aisum_permission_location', 'granted');
              console.log('📍 [Permission] 사용자 실제 위치 포착 및 세션 동기화 완료:', dongName, lat, lon, fullAddress);
            } catch (e) {
              console.warn('Storage error on geolocation:', e);
            }
            resolve('granted');
          },
          function(error) {
            console.error('위치 권한 획득 실패 (서울 기본 좌표 폴백 유지):', error);
            try {
              const defLat = 37.5665;
              const defLon = 126.9780;
              const defDong = '현재 위치';
              const defAddr = '대한민국 서울특별시';
              localStorage.setItem('aisum_permission_location', 'denied');
              sessionStorage.setItem('aisum_permission_location', 'denied');
              localStorage.setItem('user_lat', defLat);
              localStorage.setItem('user_lon', defLon);
              sessionStorage.setItem('user_lat', defLat);
              sessionStorage.setItem('user_lon', defLon);
              localStorage.setItem('aisum_user_lat', defLat);
              localStorage.setItem('aisum_user_lon', defLon);
              sessionStorage.setItem('aisum_user_lat', defLat);
              sessionStorage.setItem('aisum_user_lon', defLon);
              localStorage.setItem('user_dong', defDong);
              localStorage.setItem('aisum_user_dong', defDong);
              sessionStorage.setItem('user_dong', defDong);
              sessionStorage.setItem('aisum_user_dong', defDong);
              localStorage.setItem('aisum_user_address', defAddr);
              sessionStorage.setItem('aisum_user_address', defAddr);
            } catch (e) {}
            resolve('denied');
          },
          {
            enableHighAccuracy: false,
            timeout: 10000,
            maximumAge: 60000
          }
        );
      });

      // 1. Request Real Geolocation Permission
      try {
        await requestLocation();
      } catch (err) {
        console.warn('Location request error:', err);
      }

      // 2. Request Real Notification Permission
      try {
        if ('Notification' in window && Notification.permission === 'default') {
          const perm = await Notification.requestPermission();
          localStorage.setItem('aisum_permission_notification', perm);
          sessionStorage.setItem('aisum_permission_notification', perm);
        } else if ('Notification' in window) {
          localStorage.setItem('aisum_permission_notification', Notification.permission);
          sessionStorage.setItem('aisum_permission_notification', Notification.permission);
        } else {
          localStorage.setItem('aisum_permission_notification', 'granted');
          sessionStorage.setItem('aisum_permission_notification', 'granted');
        }
      } catch (err) {
        console.warn('Notification request error:', err);
        localStorage.setItem('aisum_permission_notification', 'granted');
        sessionStorage.setItem('aisum_permission_notification', 'granted');
      }

      // 3. Mark All 5 App Permissions Active & Persistent (전화, 카메라, 사진 포함 모든 접근권한 세션 상시 유지)
      try {
        const nowIso = new Date().toISOString();
        const perms = {
          aisum_permission_granted: 'true',
          aisum_permission_granted_at: nowIso,
          aisum_permission_phone: 'granted',
          aisum_permission_camera: 'granted',
          aisum_permission_photos: 'granted'
        };
        for (const [k, v] of Object.entries(perms)) {
          localStorage.setItem(k, v);
          sessionStorage.setItem(k, v);
        }
      } catch (e) {
        console.warn('LocalStorage error:', e);
      }

      // 4. Smooth Transition to Main Home
      window.location.href = 'index.html';
    }
  </script>
</body>

</html>
