<!DOCTYPE html>
<html lang="ko">

<head>
  <!-- 0ms FOUC Prevention Theme Script (Toss TDS Dark Theme) -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('aisum_theme') || 'light';
        var eff = t;
        if (t === 'system') {
          eff = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', eff);
      } catch(e) {}
    })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>아이숨 (i-Soom) - 야간 소아 응급의료 지원 시스템</title>
  <meta name="description" content="야간·휴일에 갑자기 아픈 우리 아이를 위한 가장 빠르고 안전한 소아청소년과 매칭 서비스" />

  <!-- Google Fonts: Plus Jakarta Sans & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap"
    rel="stylesheet" />

  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />

  <!-- Mobile App / PWA Standalone Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="아이숨" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="/css/style.css" />

  <style>
    /* Reset & Viewport Container */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #0f172a;
    }

    .splash-viewport {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      height: 100dvh;
      max-height: 932px;
      background-color: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px 28px 24px;
      box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.15);
      cursor: pointer;
      user-select: none;
      animation: fadeInPage 0.4s ease-out;
    }

    @media (max-width: 639px) {
      body {
        background-color: #ffffff;
      }
      .splash-viewport {
        max-width: 100%;
        height: 100dvh;
        min-height: 100dvh;
        max-height: 100dvh;
        box-shadow: none;
        padding-top: calc(16px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      }
    }

    @keyframes fadeInPage {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Center Main Logo Area (monimo typography style) */
    .splash-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: auto;
      margin-bottom: auto;
      text-align: center;
    }

    .brand-logo-text {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -1.4px;
      color: #111827;
      line-height: 1.1;
      display: flex;
      align-items: center;
      gap: 2px;
      animation: logoPop 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .brand-logo-text .logo-dot {
      color: #0066ff;
      display: inline-block;
      animation: pulseDot 2s infinite ease-in-out;
    }

    .brand-logo-subtext {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: -0.2px;
      opacity: 0;
      animation: fadeInSub 0.6s ease-out 0.3s forwards;
    }

    @keyframes logoPop {
      0% {
        opacity: 0;
        transform: scale(0.9) translateY(12px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes fadeInSub {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.85; }
    }

    /* Bottom Sub-brand Area (Matching Samsung Financial Networks style) */
    .splash-bottom {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 8px;
    }

    .sub-brand-title {
      font-size: 16px;
      font-weight: 800;
      color: #0043a8;
      letter-spacing: -0.4px;
      line-height: 1.2;
    }

    .sub-brand-network {
      font-size: 11px;
      font-weight: 600;
      color: #0066ff;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .home-indicator-bar {
      width: 134px;
      height: 5px;
      background-color: #111827;
      border-radius: 9999px;
      margin-top: 20px;
    }

    /* Fade-out Transition Class */
    .fade-out {
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
    }
  </style>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
</head>

<body>

  <!-- Mobile Viewport Canvas -->
  <div class="splash-viewport" id="splashScreen" onclick="proceedToNextStep()" title="터치하여 바로 시작">

    <!-- Center Brand Logo -->
    <div class="splash-center">
      <h1 class="brand-logo-text">
        아이숨<span class="logo-dot">.</span>
      </h1>
      <p class="brand-logo-subtext">야간·휴일 소아 의료 매칭</p>
    </div>

    <!-- Bottom Sub-brand Affiliation (Matching monimo Samsung Financial Networks) -->
    <div class="splash-bottom">
      <div class="sub-brand-title">i-Soom</div>
      <div class="sub-brand-network">Pediatric Healthcare Networks</div>
    </div>

  </div>

  <script>
    // Auto-redirect after 1.8 seconds (or click immediately)
    let redirected = false;

    // 접속 즉시 이번 브라우저 세션의 스플래시 진입 플래그 기록
    try {
      sessionStorage.setItem('aisum_splash_shown', 'true');
    } catch (e) {}

    function proceedToNextStep() {
      if (redirected) return;
      redirected = true;
      try {
        sessionStorage.setItem('aisum_splash_shown', 'true');
      } catch (e) {}
      const screen = document.getElementById('splashScreen');
      if (screen) {
        screen.classList.add('fade-out');
      }
      setTimeout(() => {
        const isTermsAgreed = localStorage.getItem('aisum_terms_agreed') === 'true' ||
                              sessionStorage.getItem('aisum_terms_agreed') === 'true';
        const isPermGranted = localStorage.getItem('aisum_permission_granted') === 'true' ||
                              sessionStorage.getItem('aisum_permission_granted') === 'true';

        if (!isTermsAgreed) {
          // 1. 이용약관 미동의: 최초 1순위 이용약관 동의 화면(/terms)으로 이동
          window.location.replace('/terms');
        } else if (!isPermGranted) {
          // 2. 접근 권한 미동의: 접근 권한 안내 화면(/permission)으로 이동
          window.location.replace('/permission');
        } else {
          // 3. 약관 및 권한 모두 완료된 사용자: 메인 홈(/home)으로 즉시 이동
          window.location.replace('/home');
        }
      }, 300);
    }

    // Set 1.8s timer for natural app-loading splash effect
    setTimeout(() => {
      proceedToNextStep();
    }, 1800);
  </script>
</body>

</html>
