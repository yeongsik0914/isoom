<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>증상 입력 - 아이숨 (Aisum)</title>
  <meta name="description" content="아이의 증상을 최대한 상세히 입력하여 신속한 맞춤 의료기관을 안내받으세요." />

  <!-- Google Fonts: Plus Jakarta Sans & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />

  <!-- Mobile App / PWA Standalone Meta Tags (iOS & Android 홈 화면 바로가기 지원) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="아이숨" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Safari & Chrome 크로스 브라우징 완벽 호환 듀얼 CSS 로더 -->
  <link rel="stylesheet" href="css/style.css" id="aisum-css-local" />
  <link rel="stylesheet" href="../css/style.css" id="aisum-css-parent" />
</head>

<body>

  <!-- Mobile Viewport Container -->
  <div class="input-page-viewport">

    <!-- Top App Header with Back Button -->
    <header class="input-page-header">
      <a href="index.html" class="input-back-btn" aria-label="이전 화면으로 돌아가기">
        <span class="material-symbols-outlined" style="font-size: 26px;">arrow_back</span>
      </a>
      <div style="width: 40px;"></div> <!-- visual balance -->
    </header>

    <!-- Main Content Body -->
    <main class="input-page-body">

      <!-- Headline -->
      <h1 class="input-headline">
        증상을 구체적으로<br />
        정확하게 입력해주세요
      </h1>

      <!-- Input Field Area (사용자 지시: '이름' -> '입력', 블루 언더라인) -->
      <div class="underline-input-wrapper">
        <label for="symptom-input" class="floating-input-label" id="floating-label" style="display: none;">입력</label>
        <input type="text" id="symptom-input" class="underline-input-field" placeholder="입력" autocomplete="off"
          autofocus />
        <button type="button" class="input-clear-btn" id="input-clear-btn" aria-label="입력 내용 지우기">
          <span class="material-symbols-outlined" style="font-size: 20px;">cancel</span>
        </button>
      </div>

      <!-- Confirm Action Button (레퍼런스 이미지 우측 화면 1:1 완벽 반영: 입력 시 등장) -->
      <div class="input-confirm-btn-wrap" id="input-confirm-wrap">
        <button type="button" class="input-confirm-btn" id="input-confirm-btn">
          확인
        </button>
      </div>

    </main>

    <!-- AI Analyzing Overlay (사용자 확인 클릭 시 2초간 표출되는 모던 로딩 화면) -->
    <div class="ai-analyzing-overlay" id="ai-analyzing-overlay" aria-hidden="true">
      <div class="analyzing-card">
        <!-- Pulse Logo & Spinner -->
        <div class="analyzing-visual">
          <div class="analyzing-pulse-ring"></div>
          <div class="analyzing-spinner"></div>
          <div class="analyzing-icon-center">
            <span class="material-symbols-outlined" style="font-size: 30px; color: #0066ff;">smart_toy</span>
          </div>
        </div>

        <!-- Dynamic Analyzing Status Texts -->
        <h2 class="analyzing-title" id="analyzing-title">소아 증상 정밀 분석 중</h2>
        <div class="analyzing-step-box">
          <span class="material-symbols-outlined analyzing-step-icon" id="analyzing-step-icon">health_and_safety</span>
          <span class="analyzing-step-text" id="analyzing-step-text">0ms Red Flag 안전 가드레일 검사 중...</span>
        </div>

        <!-- Progress Indicator Track -->
        <div class="analyzing-progress-bar">
          <div class="analyzing-progress-fill" id="analyzing-progress-fill"></div>
        </div>

        <p class="analyzing-subtext">
          늦은 밤, 아이를 위한 가장 안전한 병원을 찾고 있습니다.
        </p>
      </div>
    </div>

  </div>

  <!-- Safari & Chrome 크로스 브라우징 완벽 호환 듀얼 JS 로더 -->
  <script src="js/main.js"></script>
  <script src="../js/main.js"></script>
</body>

</html>
